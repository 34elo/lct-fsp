# Профили: core (инфраструктура + gateway), ml, llm, dev, obs.
# Сервисы приложения (core-api, web, ...) добавляются своими задачами со своими Dockerfile.
name: fsp

x-restart: &restart
  restart: unless-stopped

services:
  gateway:
    <<: *restart
    image: caddy:2
    profiles: [core]
    ports:
      - "${GATEWAY_PORT:-28080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - webstatic:/srv/web:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?задай CORE_DB_PASSWORD в .env}
      FSPC_DB_PASSWORD: ${FSPC_DB_PASSWORD:?задай FSPC_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-28432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d core"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7
    profiles: [core]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-28379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *restart
    image: rabbitmq:3.13-management
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?задай RABBITMQ_ADMIN_PASSWORD в .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      # UI только на localhost хоста; наружу доступ через Tailscale/SSH-туннель
      - "127.0.0.1:${RABBITMQ_UI_PORT:-28672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  rabbitmq-init:
    image: curlimages/curl:8.10.1
    profiles: [core]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_CORE_PASSWORD: ${RABBITMQ_CORE_PASSWORD:?задай RABBITMQ_CORE_PASSWORD в .env}
      RABBITMQ_ML_PASSWORD: ${RABBITMQ_ML_PASSWORD:?задай RABBITMQ_ML_PASSWORD в .env}
      RABBITMQ_FSPC_PASSWORD: ${RABBITMQ_FSPC_PASSWORD:?задай RABBITMQ_FSPC_PASSWORD в .env}
      RABBITMQ_BOT_PASSWORD: ${RABBITMQ_BOT_PASSWORD:?задай RABBITMQ_BOT_PASSWORD в .env}
    volumes:
      - ./infra/rabbitmq/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  minio:
    <<: *restart
    image: quay.io/minio/minio:latest
    profiles: [core]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fsp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задай S3_SECRET_KEY в .env}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fsp}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-fsp}
    entrypoint: ["/bin/sh", "-c", "mc alias set l http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing \"l/$$S3_BUCKET\""]
    restart: "no"

  dozzle:
    <<: *restart
    image: amir20/dozzle:latest
    profiles: [dev]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-28888}:8080"

volumes:
  pgdata:
  rabbitdata:
  minio:
  webstatic:
