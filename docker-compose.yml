# Профили: core (инфраструктура, gateway, web, core-*, fsp-*), ml, bot (нужен TG_BOT_TOKEN), llm, dev, obs.
# Запуск: make up (берёт .env, иначе .env.demo из infra/scripts/gen-demo-env.sh).
name: fsp

x-restart: &restart
  restart: unless-stopped

# --- сборка python-сервисов: общий Dockerfile, контекст — корень репозитория ---
x-py-build: &py-build
  context: .
  dockerfile: infra/docker/python.Dockerfile

# --- общее окружение python-сервисов (BaseServiceSettings) ---
x-env-common: &env-common
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:?задай JWT_SECRET в .env}
  ML_FAKE: ${ML_FAKE:-true}

x-env-core: &env-core
  <<: *env-common
  DATABASE_URL: postgresql+asyncpg://core:${CORE_DB_PASSWORD}@postgres:5432/core
  RABBITMQ_URL: amqp://core:${RABBITMQ_CORE_PASSWORD}@rabbitmq:5672/fsp
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fsp}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-fsp}
  PII_KEY: ${PII_KEY:?задай PII_KEY в .env}
  PSEUDO_ID_SECRET: ${PSEUDO_ID_SECRET:?задай PSEUDO_ID_SECRET в .env}
  ANALYTICS_SALT: ${ANALYTICS_SALT:?задай ANALYTICS_SALT в .env}
  SERVICE_TOKEN_ML: ${SERVICE_TOKEN_ML:?задай SERVICE_TOKEN_ML в .env}
  SERVICE_TOKEN_BOT: ${SERVICE_TOKEN_BOT:?задай SERVICE_TOKEN_BOT в .env}
  ML_API_URL: ${ML_API_URL:-http://ml-api:8100}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
  AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/v1/auth}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:28080}
  TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
  TG_BOT_USERNAME: ${TG_BOT_USERNAME:-}

x-core-deps: &core-deps
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  rabbitmq-init: {condition: service_completed_successfully}
  minio-init: {condition: service_completed_successfully}
  core-migrate: {condition: service_completed_successfully}

x-pyhealth: &pyhealth
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  gateway:
    <<: *restart
    image: caddy:2
    profiles: [core]
    ports:
      - "${GATEWAY_PORT:-28080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      web: {condition: service_healthy}
      core-api: {condition: service_healthy}
      fsp-mock: {condition: service_healthy}
      fsp-connector: {condition: service_healthy}
      minio: {condition: service_healthy}

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?задай CORE_DB_PASSWORD в .env}
      FSPC_DB_PASSWORD: ${FSPC_DB_PASSWORD:?задай FSPC_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-28432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d core"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7
    profiles: [core]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-28379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *restart
    image: rabbitmq:3.13-management
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?задай RABBITMQ_ADMIN_PASSWORD в .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      # UI только на localhost хоста; наружу доступ через Tailscale/SSH-туннель
      - "127.0.0.1:${RABBITMQ_UI_PORT:-28672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  rabbitmq-init:
    image: curlimages/curl:8.10.1
    profiles: [core]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_CORE_PASSWORD: ${RABBITMQ_CORE_PASSWORD:?задай RABBITMQ_CORE_PASSWORD в .env}
      RABBITMQ_ML_PASSWORD: ${RABBITMQ_ML_PASSWORD:?задай RABBITMQ_ML_PASSWORD в .env}
      RABBITMQ_FSPC_PASSWORD: ${RABBITMQ_FSPC_PASSWORD:?задай RABBITMQ_FSPC_PASSWORD в .env}
      RABBITMQ_BOT_PASSWORD: ${RABBITMQ_BOT_PASSWORD:?задай RABBITMQ_BOT_PASSWORD в .env}
    volumes:
      - ./infra/rabbitmq/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  minio:
    <<: *restart
    image: quay.io/minio/minio:latest
    profiles: [core]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fsp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задай S3_SECRET_KEY в .env}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fsp}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-fsp}
    entrypoint: ["/bin/sh", "-c", "mc alias set l http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing \"l/$$S3_BUCKET\""]
    restart: "no"

  # ---------------- приложение ----------------
  web:
    <<: *restart
    profiles: [core]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  core-migrate:
    profiles: [core]
    build:
      <<: *py-build
      args: {PACKAGE: fsp-core, SERVICE_DIR: services/core}
    image: fsp-core
    restart: "no"
    environment: *env-core
    # миграции Alembic + справочник навыков (идемпотентно)
    command: ["sh", "-c", "alembic upgrade head && python -m app.taxonomy"]
    depends_on:
      postgres: {condition: service_healthy}

  core-api:
    <<: *restart
    profiles: [core]
    image: fsp-core
    environment: *env-core
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api/v1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on: *core-deps
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]

  core-worker:
    <<: *restart
    profiles: [core]
    image: fsp-core
    environment: *env-core
    command: ["python", "-m", "app.worker"]
    depends_on: *core-deps

  core-scheduler:
    <<: *restart
    profiles: [core]
    image: fsp-core
    environment: *env-core
    command: ["python", "-m", "app.scheduler"]
    depends_on: *core-deps

  fsp-connector-migrate:
    profiles: [core]
    build:
      <<: *py-build
      args: {PACKAGE: fsp-fsp-connector, SERVICE_DIR: services/fsp-connector}
    image: fsp-fsp-connector
    restart: "no"
    environment: &env-fspc
      <<: *env-common
      DATABASE_URL: postgresql+asyncpg://fspc:${FSPC_DB_PASSWORD}@postgres:5432/fsp_connector
      RABBITMQ_URL: amqp://fspc:${RABBITMQ_FSPC_PASSWORD}@rabbitmq:5672/fsp
      FSP_ADAPTER: ${FSP_ADAPTER:-mock}
      FSP_BASE_URL: ${FSP_BASE_URL:-http://fsp-mock:8200}
      FSP_PUBLIC_URL: ${FSP_PUBLIC_URL:-}
      FSP_API_KEY: ${FSP_API_KEY:?задай FSP_API_KEY в .env}
      FSP_WEBHOOK_SECRET: ${FSP_WEBHOOK_SECRET:?задай FSP_WEBHOOK_SECRET в .env}
      FSP_OAUTH_CLIENT_ID: ${FSP_OAUTH_CLIENT_ID:-platform}
      FSP_OAUTH_REDIRECT_URI: ${FSP_OAUTH_REDIRECT_URI:-http://localhost:28080/api/v1/auth/fsp/callback}
      SERVICE_TOKEN_CORE: ${SERVICE_TOKEN_CORE:?задай SERVICE_TOKEN_CORE в .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  fsp-connector:
    <<: *restart
    profiles: [core]
    image: fsp-fsp-connector
    environment: *env-fspc
    command: ["uvicorn", "fsp_connector.main:app", "--host", "0.0.0.0", "--port", "8300"]
    depends_on: &fspc-deps
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
      fsp-connector-migrate: {condition: service_completed_successfully}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8300/healthz', timeout=3)"]

  fsp-connector-worker:
    <<: *restart
    profiles: [core]
    image: fsp-fsp-connector
    environment: *env-fspc
    command: ["python", "-m", "fsp_connector.worker"]
    depends_on: *fspc-deps

  fsp-mock:
    <<: *restart
    profiles: [core]
    build:
      <<: *py-build
      args: {PACKAGE: fsp-fsp-mock, SERVICE_DIR: services/fsp-mock}
    image: fsp-fsp-mock
    environment:
      <<: *env-common
      FSP_MOCK_API_KEY: ${FSP_API_KEY}
      FSP_WEBHOOK_URL: http://fsp-connector:8300/integrations/fsp/webhook
      FSP_WEBHOOK_SECRET: ${FSP_WEBHOOK_SECRET}
    command: ["uvicorn", "fsp_mock.main:app", "--host", "0.0.0.0", "--port", "8200"]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8200/healthz', timeout=3)"]

  ml-api:
    <<: *restart
    profiles: [ml]
    build:
      <<: *py-build
      args: {PACKAGE: fsp-ml, SERVICE_DIR: services/ml}
    image: fsp-ml
    environment: &env-ml
      <<: *env-common
      RABBITMQ_URL: amqp://ml:${RABBITMQ_ML_PASSWORD}@rabbitmq:5672/fsp
      CORE_URL: ${CORE_URL:-http://core-api:8000}
      SERVICE_TOKEN_ML: ${SERVICE_TOKEN_ML}
      LLM_PROFILE: ${LLM_PROFILE:-gpu}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3-vl-4b}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "fsp_ml.main:app", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]

  ml-worker-llm:
    <<: *restart
    profiles: [ml]
    image: fsp-ml
    environment: *env-ml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "fsp_ml.worker", "llm"]
    depends_on: &ml-deps
      rabbitmq-init: {condition: service_completed_successfully}
      ml-api: {condition: service_healthy}

  ml-worker-code:
    <<: *restart
    profiles: [ml]
    image: fsp-ml
    environment: *env-ml
    command: ["python", "-m", "fsp_ml.worker", "code"]
    depends_on: *ml-deps
    tmpfs:
      - /tmp:size=1g

  bot:
    <<: *restart
    # включается только при заданном TG_BOT_TOKEN (make up добавляет --profile bot)
    profiles: [bot]
    build:
      <<: *py-build
      args: {PACKAGE: fsp-bot, SERVICE_DIR: services/bot}
    image: fsp-bot
    environment:
      <<: *env-common
      RABBITMQ_URL: amqp://bot:${RABBITMQ_BOT_PASSWORD}@rabbitmq:5672/fsp
      CORE_URL: ${CORE_URL:-http://core-api:8000}
      SERVICE_TOKEN_BOT: ${SERVICE_TOKEN_BOT}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
    command: ["python", "-m", "fsp_bot.main"]
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
      core-api: {condition: service_healthy}

  dozzle:
    <<: *restart
    image: amir20/dozzle:latest
    profiles: [dev]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-28888}:8080"

volumes:
  pgdata:
  rabbitdata:
  minio:
