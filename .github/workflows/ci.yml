name: ci
# PR — проверки; push в main — через cd.yml (вызывает этот файл перед деплоем)
on:
  pull_request:
    # изменения только в документации проверки не запускают
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
# Новый пуш в тот же PR отменяет незаконченный прогон: проверяем только последний коммит, минуты не тратим зря.
# Вызов из cd.yml (push в main) не отменяется: у него своя группа по SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run lint-imports
      # относительные ссылки и якоря в Markdown (без сети)
      - run: PYTHONUTF8=1 uv run python tools/check_links.py
      - run: cd services/core && uv run python export_openapi.py > /tmp/openapi.json && diff -q /tmp/openapi.json ../../docs/openapi.json
      # параллельно по ядрам раннера (pytest-xdist); тесты на SQLite во временных каталогах, общих ресурсов нет
      - run: uv run pytest -q -n auto
  pdf-smoke:
    # образ core с системными библиотеками WeasyPrint отдаёт PDF-профиль
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/python.Dockerfile --build-arg PACKAGE=fsp-core --build-arg SERVICE_DIR=services/core -t fsp-core:ci .
      - run: docker run --rm -v "$PWD/infra/docker/pdf_smoke.py:/smoke.py:ro" --entrypoint python fsp-core:ci /smoke.py
  families-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: make families-check
      - run: make cards-check
  web:
    # pnpm-workspace в корне: apps/web + packages/ui (@fsp/ui), версия pnpm — из packageManager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck && pnpm -r test && pnpm -r build
