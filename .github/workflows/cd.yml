# CD продового стенда (docs/deploy.md «Прод»): push в main → проверки ci.yml → деплой на сервер.
# Задачи на сервере выполняет self-hosted раннер с меткой fsp-stand (infra/scripts/install-runner.sh).
# Токен бота платформы — секрет окружения GitHub `prod`; остальные секреты живут только на сервере.
name: cd
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать со стендом
        type: choice
        options: [deploy, backup, demo-reset, demo-reseed, demo-e2e, prod-init]
        default: deploy
      confirm:
        description: Для prod-init впишите ПЕРЕСОЗДАТЬ (тома БД будут удалены)
        required: false
        default: ""

# Одна операция со стендом за раз; новая ждёт, текущая не прерывается
concurrency:
  group: stand
  cancel-in-progress: false

env:
  STAND_DIR: ${{ vars.STAND_DIR }}

jobs:
  ci:
    if: github.event_name == 'push' || contains(fromJSON('["deploy","prod-init"]'), inputs.action)
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || contains(fromJSON('["deploy","prod-init"]'), inputs.action))
    runs-on: [self-hosted, linux, fsp-stand]
    environment:
      name: prod
      url: https://dashboard.fsp.patissons.tech
    timeout-minutes: 60
    steps:
      # полная история: каталог стенда забирает коммит из этой копии, без своих ключей к GitHub
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh infra/scripts/deploy.sh "${{ github.event_name == 'push' && 'deploy' || inputs.action }}"
        env:
          SRC_DIR: ${{ github.workspace }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          CONFIRM: ${{ inputs.confirm }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_BOT_USERNAME: ${{ vars.TG_BOT_USERNAME }}

  ops:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["backup","demo-reset","demo-reseed"]'), inputs.action)
    runs-on: [self-hosted, linux, fsp-stand]
    environment:
      name: prod
      url: https://dashboard.fsp.patissons.tech
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh infra/scripts/deploy.sh "${{ inputs.action }}"

  # E40-1: e2e демо-сценария против прода по кнопке (только демо-аккаунты: песочницы жюри, герои).
  # Адрес — переменная репозитория E2E_PROD_URL; на сервере ничего не выполняется.
  demo-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'demo-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_PROD_URL: ${{ vars.E2E_PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: test -n "$E2E_PROD_URL" || { echo "задайте переменную репозитория E2E_PROD_URL" >&2; exit 1; }
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm exec playwright test e2e/b2-prod-demo.spec.ts --project=desktop
        working-directory: apps/web
