[project]
name = "fsp-bot"
version = "0.1.0"
description = "bot"
requires-python = ">=3.12"
dependencies = ["fsp-contracts", "fsp-platform", "aiogram>=3.13", "httpx>=0.28.1", "redis>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fsp_bot"]
