[project]
name = "fsp-fsp-connector"
version = "0.1.0"
description = "fsp-connector"
requires-python = ">=3.12"
dependencies = ["fsp-contracts", "fsp-platform", "uvicorn>=0.32", "httpx>=0.28.1", "redis>=5", "alembic>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fsp_connector"]
