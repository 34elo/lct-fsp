[project]
name = "fsp-core"
version = "0.1.0"
description = "core: домен, граф, подбор, офферы"
requires-python = ">=3.12"
dependencies = [
    "fsp-contracts",
    "fsp-platform",
    "uvicorn>=0.32",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "migrations", "alembic.ini"]
