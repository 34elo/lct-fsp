[project]
name = "fsp-ml"
version = "0.1.0"
description = "ml"
requires-python = ">=3.12"
dependencies = [
    "fsp-contracts",
    "fsp-platform",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fsp_ml"]
