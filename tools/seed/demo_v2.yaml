# Офферы (вакансия компании → кандидат) и отклики (кандидат → вакансия) в разных статусах.
# vacancy: ключ из vacancies выше или `olga` (вакансия героя Ольги). days_ago — когда создан.
# status: sent | viewed | accepted | interview | hired | declined | withdrawn (для отклика: sent | viewed | withdrawn).
offers:
  - {n: 1, vacancy: gavan_backend, candidate: boris, status: interview, days_ago: 6, message: "Борис, ваш грейд Middle подтверждён тестом — приглашаем на собеседование."}
  - {n: 2, vacancy: gavan_backend, candidate: gleb, status: declined, days_ago: 5, decline_reason: low_salary}
  - {n: 3, vacancy: neiron_ai, candidate: vika, status: accepted, days_ago: 2}
  - {n: 4, vacancy: olga, candidate: anya, status: sent, days_ago: 0}
  - {n: 5, vacancy: olga, candidate: dima, status: viewed, days_ago: 1}
  - {n: 6, vacancy: pixel_frontend, candidate: mira, status: sent, days_ago: 1}
applications:
  - {vacancy: olga, candidate: boris, status: viewed, days_ago: 3, message: "Интересна ваша вакансия, стек совпадает с моим опытом."}
  - {vacancy: gavan_backend, candidate: anya, status: sent, days_ago: 1, message: "Хочу попробовать себя в команде с настоящим продуктом."}
  - {vacancy: neiron_ai, candidate: gleb, status: withdrawn, days_ago: 4}

