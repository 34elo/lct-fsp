# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: requirements_analysis
type: business
summary: Выясняет, что действительно нужно заказчику, и превращает это в проверяемые требования.
levels:
  junior:
    - Задаёт уточняющие вопросы, когда в задаче есть неоднозначность
    - Отличает функциональное требование от нефункционального
    - Записывает критерии приёмки, по которым понятно, что задача сделана
  middle:
    - Находит за просьбой заказчика исходную проблему и предлагает альтернативу
    - Выявляет противоречия между требованиями разных заинтересованных сторон
    - Формулирует нефункциональные требования измеримо, например время ответа под нагрузкой
  senior:
    - Ведёт разбор требований с несколькими командами и фиксирует общие договорённости
    - Оценивает влияние изменения требований на сроки и архитектуру
    - Отсекает требования, которые не окупаются, и аргументирует это бизнесу
concepts:
  - term: "Функциональное требование"
    note: "что система должна делать"
  - term: "Нефункциональное требование"
    note: "с каким качеством, например скорость, надёжность, безопасность"
  - term: "Критерий приёмки"
    note: "проверяемое условие готовности задачи"
  - term: "Пользовательская история"
    note: "требование с точки зрения роли пользователя и его цели"
misconceptions:
  - claim: "Требования это то, что сказал заказчик"
    truth: "заказчик часто предлагает решение, а требование нужно восстановить из проблемы"
  - claim: "Нефункциональные требования можно уточнить потом"
    truth: "они часто определяют архитектуру и дорого меняются позже"
  - claim: "Хорошее ТЗ не меняется"
    truth: "требования уточняются, важно управлять изменениями"
