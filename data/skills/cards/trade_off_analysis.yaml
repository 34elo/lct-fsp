# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: trade_off_analysis
type: thinking
summary: Сравнивает варианты решения по нескольким критериям и обосновывает выбор с учётом цены.
levels:
  junior:
    - Называет плюсы и минусы двух предложенных вариантов
    - Понимает, что быстрое решение и надёжное решение часто разные
    - Объясняет свой выбор словами, а не только тем, что так привычнее
  middle:
    - Выделяет критерии сравнения из требований задачи и взвешивает их
    - Оценивает стоимость поддержки решения, а не только стоимость разработки
    - Отмечает, какое решение легче отменить, если выбор окажется неверным
  senior:
    - Принимает архитектурные решения с явной записью альтернатив и последствий
    - Учитывает компромиссы согласованности, доступности и задержки в распределённой системе
    - Договаривается о выборе с людьми, у которых разные приоритеты
concepts:
  - term: "Критерий"
    note: "свойство, по которому сравнивают варианты, например скорость или стоимость"
  - term: "Обратимость"
    note: "насколько дорого отменить решение"
  - term: "Стоимость владения"
    note: "разработка плюс поддержка, инфраструктура и обучение"
  - term: "Запись решения"
    note: "короткий документ с контекстом, вариантами и выбором"
misconceptions:
  - claim: "Существует лучшее решение без недостатков"
    truth: "у каждого варианта есть цена, вопрос в том, какая приемлема"
  - claim: "Выбирать надо самое производительное решение"
    truth: "производительность лишь один критерий, часто важнее простота и сроки"
  - claim: "Компромиссы обсуждают только архитекторы"
    truth: "выбор между вариантами есть в любой задаче"
