# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: sql
type: hard
summary: Пишет корректные и эффективные SQL-запросы к реляционной базе и читает план выполнения.
levels:
  junior:
    - Пишет SELECT с фильтрацией, сортировкой и соединением двух таблиц
    - Группирует данные и отличает условие WHERE от условия HAVING
    - Правильно обрабатывает NULL в сравнениях и агрегатах
  middle:
    - Использует оконные функции для рейтингов, накопительных сумм и сравнения с предыдущей строкой
    - Читает план выполнения и находит полный просмотр таблицы там, где ждали индекс
    - Выбирает между подзапросом, CTE и соединением с учётом читаемости и скорости
  senior:
    - Переписывает медленный запрос под характер данных и подтверждает ускорение замером
    - Проектирует запросы и индексы для отчётов по большим таблицам без блокировки записи
    - Находит и устраняет взаимные блокировки при параллельных обновлениях
concepts:
  - term: "JOIN"
    note: "соединение строк таблиц по условию, внутреннее и внешние варианты"
  - term: "NULL"
    note: "отсутствие значения, сравнение с ним даёт UNKNOWN"
  - term: "Оконная функция"
    note: "вычисление по набору строк без схлопывания результата"
  - term: "План выполнения"
    note: "выбранный оптимизатором способ выполнить запрос"
  - term: "Селективность"
    note: "доля строк, которые проходят условие, влияет на выбор индекса"
misconceptions:
  - claim: "Условие col = NULL находит пустые значения"
    truth: "нужно писать col IS NULL, сравнение с NULL никогда не истинно"
  - claim: "COUNT(col) и COUNT(*) всегда равны"
    truth: "COUNT(col) не считает строки, где col равен NULL"
  - claim: "Без ORDER BY строки приходят в порядке вставки"
    truth: "порядок без ORDER BY не гарантирован"
