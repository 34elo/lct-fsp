# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: business_metrics
type: business
summary: Понимает, какими метриками бизнес измеряет успех продукта, и связывает с ними свою работу.
levels:
  junior:
    - Объясняет, что измеряют конверсия, удержание и средний чек
    - Понимает, какую метрику продукта затрагивает его задача
    - Отличает абсолютное значение метрики от относительного изменения
  middle:
    - Предлагает метрику успеха для фичи и способ её посчитать по событиям
    - Отличает метрики результата от метрик-индикаторов и защитных метрик
    - Замечает, когда рост метрики объясняется сезонностью или изменением выборки
  senior:
    - Строит дерево метрик от целевой метрики бизнеса до метрик команды
    - Выбирает инженерные приоритеты по ожидаемому влиянию на метрики
    - Распознаёт метрики тщеславия и манипуляцию метриками
concepts:
  - term: "Конверсия"
    note: "доля пользователей, прошедших шаг воронки"
  - term: "Удержание"
    note: "доля пользователей, вернувшихся через заданный период"
  - term: "Защитная метрика"
    note: "метрика, которая не должна ухудшиться при улучшении целевой"
  - term: "Северная звезда"
    note: "одна главная метрика ценности продукта для пользователя"
misconceptions:
  - claim: "Больше регистраций значит продукт растёт"
    truth: "без удержания и активации рост регистраций может ничего не значить"
  - claim: "Корреляция метрики с фичей доказывает эффект"
    truth: "эффект доказывает эксперимент или аккуратный анализ причинности"
  - claim: "Метрики это забота аналитиков"
    truth: "инженер, понимающий метрики, лучше выбирает, что делать"
