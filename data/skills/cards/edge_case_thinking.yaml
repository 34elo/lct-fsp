# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: edge_case_thinking
type: thinking
summary: Заранее видит граничные и необычные входы, на которых решение может сломаться.
levels:
  junior:
    - Проверяет пустой вход, один элемент и максимальный размер
    - Учитывает нулевые, отрицательные и очень большие числа
    - Замечает в условии случаи, которые не описаны явно, и уточняет их
  middle:
    - Ищет граничные случаи систематически через классы эквивалентности и границы диапазонов
    - Учитывает часовые пояса, кодировки, дубликаты и порядок событий
    - Проверяет поведение при частичном отказе зависимости
  senior:
    - Предвидит редкие сочетания условий в распределённой системе, например повторную доставку и гонки
    - Определяет, какие граничные случаи важны для бизнеса, а какие можно отложить
    - Встраивает защиту от граничных случаев в контракты и валидацию на границах системы
concepts:
  - term: "Граничное значение"
    note: "значение на краю допустимого диапазона и сразу за ним"
  - term: "Класс эквивалентности"
    note: "группа входов, на которых система ведёт себя одинаково"
  - term: "Переполнение"
    note: "результат не помещается в тип данных"
  - term: "Идемпотентность"
    note: "повтор операции не меняет результат"
misconceptions:
  - claim: "Если прошли все примеры из условия, решение верно"
    truth: "примеры редко покрывают границы, их нужно перебирать отдельно"
  - claim: "Граничные случаи это только пустой ввод"
    truth: "сюда же входят дубликаты, порядок, время, кодировки и отказы"
  - claim: "Все граничные случаи нужно обработать сразу"
    truth: "важно понять риск каждого и обработать значимые"
