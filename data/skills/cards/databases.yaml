# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: databases
type: fundamental
summary: Понимает, как реляционная СУБД хранит данные, обеспечивает целостность и выполняет запросы.
levels:
  junior:
    - Проектирует простую схему из нескольких таблиц с первичными и внешними ключами
    - Объясняет, зачем нужна нормализация, и приводит таблицу к третьей нормальной форме
    - Понимает, что транзакция выполняется целиком или не выполняется вовсе
  middle:
    - Выбирает индексы под конкретные запросы и объясняет их цену при записи
    - Называет аномалии параллельного доступа и уровни изоляции, которые от них защищают
    - Осознанно денормализует схему ради чтения и описывает, чем за это платит
  senior:
    - Проектирует схему под рост данных с учётом партиционирования и архивации
    - Выбирает между репликацией, шардированием и кешем по требованиям к согласованности
    - Планирует миграцию схемы без простоя и с возможностью отката
concepts:
  - term: "Нормальные формы"
    note: "правила разложения таблиц против избыточности и аномалий обновления"
  - term: "Транзакция и ACID"
    note: "атомарность, согласованность, изоляция и долговечность изменений"
  - term: "Индекс"
    note: "структура (обычно B-дерево) для быстрого поиска ценой места и медленной записи"
  - term: "Уровни изоляции"
    note: "компромисс между параллельностью и защитой от аномалий чтения"
  - term: "Репликация"
    note: "копии данных для чтения и отказоустойчивости с задержкой синхронизации"
misconceptions:
  - claim: "Чем больше индексов, тем быстрее работает база"
    truth: "каждый индекс замедляет вставку и обновление и занимает место"
  - claim: "Транзакция сама защищает от любых гонок"
    truth: "на уровне READ COMMITTED возможны потерянные обновления, нужны блокировки или более строгая изоляция"
  - claim: "Нормализация всегда лучше денормализации"
    truth: "для тяжёлых чтений денормализация оправдана, если согласованность поддерживается явно"
