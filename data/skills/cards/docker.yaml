# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: docker
type: hard
summary: Упаковывает приложение в контейнер, собирает компактные образы и запускает связку сервисов.
levels:
  junior:
    - Пишет Dockerfile для приложения и запускает контейнер с пробросом порта
    - Отличает образ от контейнера и объясняет, куда пропадают данные после удаления контейнера
    - Поднимает несколько сервисов через docker compose
  middle:
    - Строит многоэтапную сборку и уменьшает образ, правильно упорядочивая слои под кеш
    - Подключает тома и сети и объясняет, как сервисы находят друг друга по имени
    - Настраивает проверку здоровья и ограничения памяти и процессора
  senior:
    - Обеспечивает безопасность образа без root, с минимальной базой и сканированием уязвимостей
    - Разбирает падение контейнера в проде по логам, кодам выхода и событиям рантайма
    - Выбирает, когда хватает compose, а когда нужен оркестратор
concepts:
  - term: "Образ и слой"
    note: "неизменяемый шаблон из слоёв, каждый слой кешируется"
  - term: "Контейнер"
    note: "изолированный процесс, запущенный из образа"
  - term: "Том"
    note: "хранилище данных вне жизненного цикла контейнера"
  - term: "Многоэтапная сборка"
    note: "сборка в одном образе и копирование результата в маленький"
misconceptions:
  - claim: "Контейнер это лёгкая виртуальная машина"
    truth: "контейнер делит ядро с хостом и изолирован пространствами имён и cgroups"
  - claim: "Удаление файла в следующем слое уменьшает образ"
    truth: "файл остаётся в предыдущем слое, удалять нужно в той же инструкции"
  - claim: "Тег latest означает последнюю версию"
    truth: "это просто имя тега по умолчанию без гарантий свежести"
