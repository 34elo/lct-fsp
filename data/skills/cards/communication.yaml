# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: communication
type: soft
summary: Ясно передаёт мысли устно и письменно и понимает собеседника, в том числе нетехнического.
levels:
  junior:
    - Кратко и по делу описывает, что сделал и где застрял
    - Задаёт вопрос так, чтобы на него можно было ответить без созвона
    - Предупреждает заранее, если не успевает к сроку
  middle:
    - Объясняет техническое решение нетехническому коллеге без жаргона
    - Пишет документ или описание задачи, которые понятны без автора
    - Подстраивает подробность рассказа под слушателя
  senior:
    - Доносит сложное решение до руководства и команды и добивается согласия
    - Ведёт трудный разговор о сроках, качестве или разногласиях конструктивно
    - Налаживает обмен информацией между командами
concepts:
  - term: "Контекст"
    note: "сведения, без которых сообщение нельзя понять"
  - term: "Асинхронная коммуникация"
    note: "сообщения, на которые отвечают в удобное время"
  - term: "Обратная связь"
    note: "проверка, что собеседник понял так, как задумано"
  - term: "Эскалация"
    note: "своевременное поднятие проблемы к тем, кто может помочь"
misconceptions:
  - claim: "Хорошая коммуникация это много сообщений"
    truth: "важна ясность и своевременность, а не объём"
  - claim: "Признаться, что не успеваешь, значит показать слабость"
    truth: "раннее предупреждение позволяет команде перестроиться"
  - claim: "Разработчику достаточно писать код"
    truth: "большая часть ошибок проекта возникает из недопонимания"
