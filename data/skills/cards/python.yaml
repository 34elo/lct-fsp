# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: python
type: hard
summary: Пишет понятный и надёжный код на Python, знает модель данных языка и стандартную библиотеку.
levels:
  junior:
    - Использует списки, словари, множества и выбирает подходящую структуру под задачу
    - Пишет функции и классы, обрабатывает исключения без подавления всех ошибок подряд
    - Отличает изменяемые объекты от неизменяемых и понимает передачу ссылок в функцию
  middle:
    - Пишет генераторы и контекстные менеджеры и объясняет, когда они экономят память
    - Использует аннотации типов и проверку статическим анализатором
    - Пишет асинхронный код на asyncio и не блокирует цикл событий синхронными вызовами
  senior:
    - Профилирует код и выбирает между оптимизацией алгоритма, C-расширением и процессами
    - Объясняет влияние GIL на потоки и выбирает модель параллельности под нагрузку
    - Проектирует структуру пакета и публичный интерфейс модуля для команды
concepts:
  - term: "Изменяемость"
    note: "list и dict меняются на месте, tuple и str нет"
  - term: "Генератор"
    note: "ленивое вычисление последовательности по одному элементу"
  - term: "GIL"
    note: "глобальная блокировка интерпретатора, мешает параллельным потокам на CPU"
  - term: "Контекстный менеджер"
    note: "гарантированное освобождение ресурса через with"
misconceptions:
  - claim: "Значение по умолчанию def f(x=[]) создаётся при каждом вызове"
    truth: "оно создаётся один раз при определении функции и разделяется между вызовами"
  - claim: "Потоки ускоряют любые вычисления"
    truth: "из-за GIL потоки ускоряют ввод-вывод, а для CPU нужны процессы"
  - claim: "Оператор is сравнивает значения"
    truth: "is сравнивает идентичность объектов, значения сравнивает =="
