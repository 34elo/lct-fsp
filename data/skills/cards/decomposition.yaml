# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: decomposition
type: thinking
summary: Разбивает большую или неясную задачу на понятные части с проверяемым результатом.
levels:
  junior:
    - Делит поставленную задачу на шаги, каждый из которых можно проверить отдельно
    - Выделяет в задаче вход, выход и ограничения до начала работы
    - Сообщает, какой шаг непонятен, вместо того чтобы молча застрять
  middle:
    - Разбивает фичу на независимые части, которые можно делать и выкатывать параллельно
    - Выделяет самый рискованный кусок и делает его первым
    - Находит минимальную версию, которая уже приносит пользу
  senior:
    - Декомпозирует систему на модули с ясными границами и контрактами
    - Разбивает большой проект на этапы с промежуточными результатами для бизнеса
    - Перестраивает план, когда одна из частей оказалась сложнее ожидаемого
concepts:
  - term: "Подзадача"
    note: "часть работы с собственным проверяемым результатом"
  - term: "Зависимость"
    note: "порядок, в котором части можно делать"
  - term: "Вертикальный срез"
    note: "тонкая сквозная часть фичи от интерфейса до данных"
  - term: "Минимальная версия"
    note: "наименьший объём, который уже решает задачу пользователя"
misconceptions:
  - claim: "Хорошая декомпозиция это разбиение по слоям"
    truth: "срез по слоям даёт части без ценности, чаще лучше вертикальные срезы"
  - claim: "Чем мельче задачи, тем лучше"
    truth: "слишком мелкие задачи дают накладные расходы и теряют смысл целого"
  - claim: "План декомпозиции нельзя менять"
    truth: "план уточняется по мере того, как снижается неопределённость"
