# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: rag
type: hard
summary: Строит систему, где языковая модель отвечает по найденным документам, и измеряет её качество.
levels:
  junior:
    - Объясняет схему поиск плюс генерация и зачем она нужна вместо дообучения модели
    - Нарезает документы на фрагменты и строит по ним векторный индекс
    - Собирает промпт из вопроса и найденных фрагментов с требованием ссылаться на источник
  middle:
    - Подбирает размер фрагментов, перекрытие и число найденных фрагментов по метрикам
    - Комбинирует векторный и лексический поиск и добавляет переранжирование
    - Измеряет отдельно качество поиска и качество ответа на размеченном наборе вопросов
  senior:
    - Проектирует обновление индекса при изменении документов без простоя и рассинхрона
    - Защищает систему от инъекций в документах и утечки данных между пользователями
    - Оценивает стоимость и задержку ответа и выбирает компромисс под продукт
concepts:
  - term: "Эмбеддинг"
    note: "вектор, близость которого отражает близость смысла текстов"
  - term: "Чанкинг"
    note: "нарезка документов на фрагменты для индексации"
  - term: "Переранжирование"
    note: "уточнение порядка найденного более точной моделью"
  - term: "Grounding"
    note: "ответ опирается только на найденные источники и ссылается на них"
  - term: "Recall@k"
    note: "доля вопросов, для которых нужный фрагмент попал в первые k"
misconceptions:
  - claim: "RAG убирает галлюцинации"
    truth: "модель может игнорировать контекст или выдумывать, нужна проверка ссылок и оценка"
  - claim: "Чем больше фрагментов в промпте, тем лучше ответ"
    truth: "лишний контекст размывает внимание модели и увеличивает стоимость"
  - claim: "Плохой ответ значит слабую модель"
    truth: "часто виноват поиск, поэтому его качество меряют отдельно"
