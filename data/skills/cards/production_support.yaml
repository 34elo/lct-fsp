# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: production_support
type: experience
summary: Имеет опыт сопровождения работающей системы — реагирует на инциденты и делает выводы из них.
levels:
  junior:
    - Участвовал в разборе инцидента и может рассказать, что произошло и как чинили
    - Умеет найти нужные логи и метрики сервиса, за который отвечает
    - Знает, к кому и как эскалировать проблему в проде
  middle:
    - Самостоятельно дежурил и восстанавливал сервис по инструкции или без неё
    - Писал разбор инцидента с причиной и мерами против повторения
    - Настраивал алерты так, чтобы они срабатывали по делу
  senior:
    - Руководил устранением крупного инцидента и координировал несколько команд
    - Строил процесс дежурств и инструкций, снижающий время восстановления
    - Определял целевые уровни надёжности сервиса вместе с бизнесом
concepts:
  - term: "Инцидент"
    note: "незапланированное ухудшение работы сервиса для пользователей"
  - term: "Постмортем"
    note: "разбор инцидента без поиска виноватых с мерами против повторения"
  - term: "Время восстановления"
    note: "время от начала инцидента до восстановления сервиса"
  - term: "SLO"
    note: "целевой уровень надёжности, например доля успешных запросов"
misconceptions:
  - claim: "Главное в инциденте найти виновного"
    truth: "цель разбора в причинах и мерах, поиск виноватых мешает честности"
  - claim: "Больше алертов значит лучше мониторинг"
    truth: "шумные алерты приучают их игнорировать"
  - claim: "Сначала нужно найти причину, потом чинить"
    truth: "сначала восстанавливают сервис, например откатом, а причину ищут потом"
