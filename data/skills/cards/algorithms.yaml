# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: algorithms
type: fundamental
summary: Выбирает и реализует алгоритм под задачу, оценивает его сложность по времени и памяти.
levels:
  junior:
    - Реализует сортировку, бинарный поиск и обход графа в ширину и в глубину
    - Оценивает асимптотику простого цикла и вложенных циклов в нотации O
    - Отличает задачу, где нужен перебор, от задачи с очевидным жадным решением
  middle:
    - Применяет динамическое программирование и доказывает корректность перехода
    - Выбирает алгоритм кратчайшего пути под свойства графа, например веса рёбер
    - Оценивает, уложится ли решение в ограничения по времени при заданном размере входа
  senior:
    - Сводит незнакомую задачу к известному классу задач или доказывает её трудность
    - Выбирает приближённый или вероятностный алгоритм, когда точный слишком дорог
    - Учитывает константы, кеш процессора и распределение данных, а не только асимптотику
concepts:
  - term: "Асимптотическая сложность"
    note: "рост времени или памяти в зависимости от размера входа"
  - term: "Динамическое программирование"
    note: "решение через подзадачи с запоминанием ответов"
  - term: "Жадный алгоритм"
    note: "локально лучший выбор на каждом шаге, корректен не всегда"
  - term: "Амортизированная оценка"
    note: "средняя стоимость операции на длинной последовательности"
misconceptions:
  - claim: "Алгоритм за O(n log n) всегда быстрее алгоритма за O(n^2)"
    truth: "на малых входах константы важнее, поэтому сортировки переключаются на вставки"
  - claim: "Жадный алгоритм работает, если проходит примеры"
    truth: "корректность жадного выбора нужно доказать, иначе контрпример найдётся"
  - claim: "Рекурсия всегда медленнее цикла"
    truth: "разница обычно в константе и глубине стека, а не в асимптотике"
