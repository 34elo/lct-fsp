# Карточка навыка. Черновик; содержание проверяет человек.
schema_version: 1
skill: debugging
type: thinking
summary: Находит причину ошибки системно — воспроизводит, сужает область поиска и проверяет гипотезы.
levels:
  junior:
    - Воспроизводит ошибку по описанию и читает стек вызовов
    - Пользуется отладчиком и логами, чтобы увидеть реальные значения переменных
    - Проверяет исправление тем же сценарием, которым воспроизводил ошибку
  middle:
    - Формулирует гипотезы о причине и проверяет их по одной
    - Сужает поиск делением пополам по коду, данным или истории коммитов
    - Пишет тест, который падает до исправления и проходит после
  senior:
    - Отлаживает плавающие ошибки гонок и утечек ресурсов по косвенным признакам
    - Разбирает инцидент в распределённой системе по метрикам, трассам и логам нескольких сервисов
    - Добавляет в систему наблюдаемость, которая сократит поиск следующей похожей ошибки
concepts:
  - term: "Воспроизведение"
    note: "стабильный сценарий, при котором ошибка проявляется"
  - term: "Бисекция"
    note: "деление пространства поиска пополам, например git bisect"
  - term: "Гипотеза"
    note: "проверяемое предположение о причине"
  - term: "Наблюдаемость"
    note: "логи, метрики и трассы, по которым видно состояние системы"
misconceptions:
  - claim: "Если ошибка пропала после правки, она исправлена"
    truth: "без понимания причины ошибка могла просто стать реже"
  - claim: "Отладка начинается с чтения кода"
    truth: "быстрее сначала воспроизвести и сузить место, а потом читать"
  - claim: "Много отладочного вывода помогает"
    truth: "вывод без гипотезы тонет в шуме"
