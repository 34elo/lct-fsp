# Карточка навыка (assessment.md §2). Черновик E21-2, содержание проверяет человек.
schema_version: 1
skill: code_review
type: soft
summary: Даёт и принимает полезную обратную связь по коду, улучшая качество и не задевая людей.
levels:
  junior:
    - Готовит небольшой запрос на слияние с понятным описанием изменений
    - Спокойно принимает замечания и задаёт вопросы, если замечание непонятно
    - Замечает в чужом коде явные ошибки и опечатки и пишет о них вежливо
  middle:
    - Отделяет в ревью блокирующие замечания от пожеланий и вкусовщины
    - Проверяет не только стиль, но и корректность, граничные случаи и тесты
    - Объясняет причину замечания и предлагает вариант исправления
  senior:
    - Выстраивает в команде правила ревью, которые ускоряют, а не тормозят работу
    - Использует ревью для обучения младших коллег без давления
    - Разрешает спор в ревью по существу, опираясь на договорённости команды
concepts:
  - term: "Блокирующее замечание"
    note: "без исправления изменение нельзя сливать"
  - term: "Нит"
    note: "мелкое необязательное замечание о стиле"
  - term: "Размер изменения"
    note: "чем меньше дифф, тем внимательнее и быстрее ревью"
  - term: "Тон обратной связи"
    note: "замечание о коде, а не о человеке"
misconceptions:
  - claim: "Ревью нужно для поиска опечаток и стиля"
    truth: "стиль проверяет линтер, ревью ищет ошибки логики и проблемы дизайна"
  - claim: "Хороший ревьюер оставляет много замечаний"
    truth: "ценность в важных замечаниях, а не в их количестве"
  - claim: "Старший разработчик не нуждается в ревью"
    truth: "ревью нужно всем, это ещё и распространение знаний"
