  - {slug: rag, name: RAG, kind: hard, group: data_ml, testable: true, aliases: [retrieval-augmented generation, поиск с генерацией]}
  - {slug: prompt_engineering, name: Проектирование промптов, kind: hard, group: data_ml, aliases: [промпты, prompting, подбор промптов]}
  - {slug: vector_databases, name: Векторные базы данных, kind: hard, group: data_ml, aliases: [vector db]}
  - {slug: llm_evaluation, name: Оценка качества LLM, kind: hard, group: data_ml, aliases: [llm evaluation, llm eval, evals, оценка ответов llm, llm as judge]}
  - {slug: llm_serving, name: Развёртывание LLM, kind: hard, group: data_ml, aliases: [llm serving, vllm, llama.cpp, llama-server, инференс llm, ollama]}

# Тип навыка: переопределения для навыков, чей тип не следует из kind/group.
skill_types:
  - type: fundamental
    skills: [databases, networks, statistics]
  - type: thinking
    skills: [problem_solving, system_design, microservices, decomposition, debugging, estimation,
             trade_off_analysis, abstraction, risk_assessment, edge_case_thinking,
             root_cause_analysis, performance_reasoning, data_driven_thinking]
  - type: experience
    skills: [self_learning]
