  - {slug: root_cause_analysis, name: Анализ первопричин, kind: soft, aliases: [rca, root cause, разбор инцидентов, postmortem]}
  - {slug: performance_reasoning, name: Рассуждение о производительности, kind: soft, aliases: [performance reasoning, профилирование мышление, узкие места]}
  - {slug: data_driven_thinking, name: Мышление на данных, kind: soft, aliases: [data-driven, решения на данных, data driven thinking]}
  # --- Бизнес ---
  - {slug: requirements_analysis, name: Работа с требованиями, kind: domain, group: analysis, aliases: [requirements analysis]}
  - {slug: business_metrics, name: Бизнес-метрики, kind: domain, group: product, aliases: [business metrics, продуктовые метрики, kpi, okr]}
