  - {slug: prioritization, name: Расстановка приоритетов в продукте, kind: domain, group: product, aliases: [moscow]}
  - {slug: stakeholder_management, name: Работа со стейкхолдерами, kind: domain, group: product, aliases: [stakeholders, управление ожиданиями]}
  - {slug: user_research, name: Изучение потребностей пользователей, kind: domain, group: design, aliases: [интервью с пользователями]}
