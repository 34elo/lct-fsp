# Навыки для теста (E21-1): мышление, бизнес, софт, опыт, AI Engineer + типы навыков.
# Тип навыка (assessment.md §2): fundamental | hard | thinking | business | soft | experience.
# Без явного типа: kind soft → soft; group fundamentals → fundamental; group product/analysis/design → business;
# остальное → hard. Переопределения — в списке `skill_types` ниже.
skills:
  # --- Инженерное мышление ---
  - {slug: decomposition, name: Декомпозиция задач, kind: soft, aliases: [разбиение задач, task decomposition, разбор задачи на части]}
  - {slug: debugging, name: Отладка и поиск причин, kind: soft, aliases: [отладка, дебаг, поиск багов]}
