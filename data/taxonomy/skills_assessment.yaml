  - {slug: team_projects, name: Командные проекты, kind: domain, group: experience, aliases: [team projects, командная разработка]}
  - {slug: public_speaking, name: Доклады и публикации, kind: domain, group: experience, aliases: [выступления на конференциях, публикации статей, технические статьи]}
