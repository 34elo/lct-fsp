# Черновик банка (E2-5): вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: react
status: draft
source: llm_draft
questions:
- id: react-01
  d: 1
  text: Что такое компонент в React?
  options: [Таблица стилей, Запрос к серверу, 'Функция (или класс), возвращающая описание интерфейса', Файл конфигурации]
  correct: C
  explanation: Компонент принимает props и возвращает JSX.
- id: react-02
  d: 1
  text: Для чего нужны props?
  options: [Для хранения состояния компонента, Для передачи данных от родителя к дочернему компоненту, Для запросов к API, Для маршрутизации]
  correct: B
  explanation: Props только для чтения, их нельзя менять внутри потомка.
- id: react-03
  d: 2
  text: Какой хук хранит локальное состояние функционального компонента?
  options: [useState, useEffect, useMemo, useRef только]
  correct: A
  explanation: useState возвращает пару [значение, функция обновления].
- id: react-04
  d: 2
  text: Зачем нужен атрибут key в элементах списка?
  options: [Для доступа через DOM, Для стилизации, Для передачи данных, Чтобы React мог сопоставлять элементы между рендерами]
  correct: D
  explanation: Ключ должен быть стабильным и уникальным среди соседей; индекс массива при перестановках — плохой выбор.
- id: react-05
  d: 2
  text: Какой синтаксис правильно обновляет состояние-массив items, добавляя элемент x?
  options: ['items = [...items, x]', items.push(x), 'setItems([...items, x])', setItems(items.push(x))]
  correct: C
  explanation: Состояние нельзя мутировать, нужно передавать новый массив.
- id: react-06
  d: 3
  text: Когда выполняется useEffect(() => { ... }, [])?
  options: [Перед каждым рендером, Один раз после первого монтирования компонента, После каждого рендера, Только при размонтировании]
  correct: B
  explanation: Пустой массив зависимостей означает эффект без повторных запусков; функция очистки вызывается при размонтировании.
- id: react-07
  d: 3
  text: Чему станет равно n после одного клика по кнопке?
  code: "function C() {\n  const [n, setN] = useState(0);\n  const inc = () => { setN(n + 1); setN(n + 1); };\n  return <button onClick={inc}>{n}</button>;\n}"
  options: [После одного клика n станет 1, n не изменится, После одного клика n станет 2, Ошибка рендера]
  correct: A
  explanation: Оба вызова используют одно значение n из замыкания. Для накопления нужен setN(prev => prev + 1).
- id: react-08
  d: 3
  text: Для чего служит useRef?
  options: [Кеширует результат вычисления, Запускает эффект, Подписывается на контекст, Хранит изменяемое значение между рендерами без перерисовки и даёт доступ к DOM-узлу]
  correct: D
  explanation: Изменение ref.current не вызывает повторного рендера.
- id: react-09
  d: 3
  text: Что делает React Context?
  options: [Хранит данные на сервере, Ускоряет сборку, Позволяет передавать значение вглубь дерева без передачи props через каждый уровень, Заменяет хук useState]
  correct: C
  explanation: Все потребители контекста перерисовываются при изменении его значения.
- id: react-10
  d: 4
  text: Когда оправдан useMemo?
  options: [Для запросов к серверу, 'Для кеширования дорогого вычисления или стабилизации ссылки на объект, передаваемый мемоизированному потомку', Для хранения состояния, Всегда оборачивать каждое значение]
  correct: B
  explanation: Преждевременная мемоизация усложняет код; сначала измеряйте.
- id: react-11
  d: 4
  text: Что произойдёт, если в useEffect читается пропс, но он не указан в массиве зависимостей?
  options: [Эффект может работать с устаревшим значением (stale closure), Эффект запустится при каждом рендере, React выдаст ошибку компиляции в любом случае, 'Ничего, эффект всегда видит свежие значения']
  correct: A
  explanation: Правило react-hooks/exhaustive-deps ловит такие случаи.
- id: react-12
  d: 4
  text: Чем управляемый (controlled) input отличается от неуправляемого?
  options: [Разницы нет, Значение хранится только в DOM, Управляемый не поддерживает ввод, Значение хранится в состоянии React и передаётся через value/onChange]
  correct: D
  explanation: В неуправляемом поле значение читают через ref или FormData.
- id: react-13
  d: 4
  text: Какой компонент отложит отображение, пока не загрузится лениво подключаемый компонент?
  options: [<StrictMode>, <Fragment>, '<Suspense fallback={...}> вместе с React.lazy', <Profiler>]
  correct: C
  explanation: React.lazy загружает код по требованию, Suspense показывает запасной интерфейс на время загрузки.
- id: react-14
  d: 5
  text: Почему в StrictMode в режиме разработки эффекты выполняются дважды при монтировании?
  options: [Для ускорения, Чтобы помочь выявить эффекты без корректной очистки и побочные эффекты при рендере, Для логирования, Это баг]
  correct: B
  explanation: React намеренно монтирует, размонтирует и снова монтирует компонент; в продакшене этого нет.
- id: react-15
  d: 5
  text: Что делает React.memo(Component)?
  options: ['Пропускает повторный рендер, если props поверхностно не изменились', Замораживает состояние, Сохраняет компонент в localStorage, Кеширует результат запроса]
  correct: A
  explanation: Сравнение поверхностное; новые ссылки на объекты и функции в props сведут пользу на нет.
