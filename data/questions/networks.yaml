# Черновик банка: вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: networks
status: draft
source: llm_draft
questions:
- id: networks-01
  d: 1
  text: Какой протокол сопоставляет доменное имя и IP-адрес?
  options: [ARP, DNS, DHCP, SMTP]
  correct: B
  explanation: DNS преобразует имена в адреса.
- id: networks-02
  d: 1
  text: Какой порт по умолчанию использует HTTPS?
  options: ['443', '80', '8080', '21']
  correct: A
  explanation: HTTP — 80, HTTPS — 443.
- id: networks-03
  d: 2
  text: Чем TCP отличается от UDP?
  options: [Они одинаковы, TCP без соединения и без гарантий доставки, UDP надёжнее TCP, 'TCP устанавливает соединение и гарантирует доставку по порядку, UDP — нет']
  correct: D
  explanation: UDP быстрее и проще, подходит для голоса, игр, DNS-запросов.
- id: networks-04
  d: 2
  text: Что означает код ответа HTTP 404?
  options: [Перенаправление, Ошибка сервера, Ресурс не найден, Доступ запрещён]
  correct: C
  explanation: 403 — доступ запрещён, 500 — ошибка сервера, 301/302 — перенаправление.
- id: networks-05
  d: 2
  text: Сколько адресов хостов в сети 192.168.1.0/24 (без служебных)?
  options: ['128', '254', '255', '256']
  correct: B
  explanation: 'Из 256 адресов два служебных: сети и широковещательный.'
- id: networks-06
  d: 3
  text: Что происходит при трёхстороннем рукопожатии TCP?
  options: ['SYN, SYN-ACK, ACK', 'ACK, ACK, SYN', 'HELLO, OK, DATA', 'SYN, ACK, FIN']
  correct: A
  explanation: Клиент шлёт SYN, сервер отвечает SYN-ACK, клиент подтверждает ACK.
- id: networks-07
  d: 3
  text: Для чего служит NAT?
  options: [Для шифрования трафика, Для балансировки DNS, Для кеширования страниц, 'Для трансляции частных адресов во внешние, позволяя многим хостам делить один публичный адрес']
  correct: D
  explanation: NAT подменяет адреса и порты и ведёт таблицу соответствия.
- id: networks-08
  d: 3
  text: Чем отличаются HTTP-методы PUT и POST?
  options: [PUT только читает, 'POST идемпотентен, PUT нет', 'PUT идемпотентен (повтор даёт тот же результат), POST — не обязан быть', Это синонимы]
  correct: C
  explanation: Повтор PUT с теми же данными не меняет состояние дальше; POST обычно создаёт новый ресурс при каждом вызове.
- id: networks-09
  d: 3
  text: Какой протокол динамически выдаёт хостам IP-адреса в локальной сети?
  options: [SSH, DHCP, ICMP, DNS]
  correct: B
  explanation: DHCP выдаёт адрес, маску, шлюз и DNS-серверы.
- id: networks-10
  d: 4
  text: Что делает TLS при подключении по HTTPS?
  options: [Аутентифицирует сервер по сертификату и шифрует канал, Разбивает пакеты, Подменяет IP-адрес, Только сжимает данные]
  correct: A
  explanation: Клиент проверяет цепочку сертификатов, затем стороны согласуют ключи.
- id: networks-11
  d: 4
  text: К какому уровню модели OSI относится протокол IP?
  options: [Прикладному (7), Канальному (2), Транспортному (4), Сетевому (3)]
  correct: D
  explanation: IP — сетевой уровень, TCP/UDP — транспортный, Ethernet — канальный.
- id: networks-12
  d: 4
  text: Что показывает traceroute?
  options: [Скорость канала, Версию ОС удалённого хоста, 'Маршрутизаторы на пути до узла, используя увеличивающийся TTL', Список портов]
  correct: C
  explanation: Каждый маршрутизатор при TTL=0 отвечает ICMP Time Exceeded.
- id: networks-13
  d: 4
  text: 'Что означает «Connection: keep-alive» в HTTP/1.1?'
  options: [Соединение закрывается после ответа, TCP-соединение переиспользуется для нескольких запросов, Включено шифрование, Сервер не отвечает]
  correct: B
  explanation: Это снижает накладные расходы на установку соединений.
- id: networks-14
  d: 5
  text: В чём главное преимущество HTTP/3 (QUIC) перед HTTP/2?
  options: [Работает поверх UDP и избегает блокировки очереди на уровне транспорта, Использует больше портов, Отменяет шифрование, Работает только в локальной сети]
  correct: A
  explanation: Потеря пакета останавливает только затронутый поток, а не все потоки соединения; QUIC включает TLS 1.3.
- id: networks-15
  d: 5
  text: Зачем нужен протокол BGP?
  options: [Для шифрования почты, Для выдачи адресов хостам, Для разрешения имён, Для обмена маршрутной информацией между автономными системами в интернете]
  correct: D
  explanation: BGP — протокол междоменной маршрутизации.
