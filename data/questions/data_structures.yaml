# Черновик банка: вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: data_structures
status: draft
source: llm_draft
questions:
- id: data_structures-01
  d: 1
  text: Какая структура работает по принципу LIFO?
  options: [Стек, Бинарное дерево, Хеш-таблица, Очередь]
  correct: A
  explanation: 'Стек: последним пришёл — первым вышел.'
- id: data_structures-02
  d: 1
  text: Какова сложность доступа к элементу массива по индексу?
  options: [O(n^2), O(n), O(log n), O(1)]
  correct: D
  explanation: Элементы лежат в памяти подряд, адрес вычисляется по формуле.
- id: data_structures-03
  d: 2
  text: Какова средняя сложность поиска по ключу в хеш-таблице?
  options: [O(n log n), O(log n), O(1), O(n)]
  correct: C
  explanation: При хорошей хеш-функции и разумном коэффициенте заполнения — константа в среднем.
- id: data_structures-04
  d: 2
  text: Что быстрее в односвязном списке без хвостового указателя?
  options: [Вставка в конец, Вставка в начало, Доступ по индексу, Поиск минимума]
  correct: B
  explanation: Вставка в начало — O(1); остальные операции требуют обхода.
- id: data_structures-05
  d: 2
  text: В чём главное свойство двоичного дерева поиска?
  options: ['Для узла все ключи слева меньше, справа больше', Высота всегда равна log n, Все узлы имеют ровно два потомка, Корень — максимальный элемент]
  correct: A
  explanation: Это инвариант BST; высота зависит от порядка вставки.
- id: data_structures-06
  d: 3
  text: Какая сложность вставки и извлечения минимума в двоичной куче из n элементов?
  options: [O(n) и O(1), O(log n) и O(n), O(1) и O(1), O(log n) и O(log n)]
  correct: D
  explanation: Просеивание вверх или вниз проходит по высоте дерева.
- id: data_structures-07
  d: 3
  text: Что такое коллизия в хеш-таблице и как её можно разрешить?
  options: [Ошибка хеш-функции; игнорировать, Удаление ключа; перестроить таблицу, Одинаковый индекс у разных ключей; цепочки или открытая адресация, Переполнение; увеличить память процесса]
  correct: C
  explanation: Два ключа попадают в одну ячейку; используют списки в ячейках или перебор соседних ячеек.
- id: data_structures-08
  d: 3
  text: Какая структура позволяет эффективно проверять, лежат ли два элемента в одном множестве, и объединять множества?
  options: [Куча, Система непересекающихся множеств (DSU), Стек, Префиксное дерево]
  correct: B
  explanation: DSU с сжатием путей и объединением по рангу даёт почти O(1) амортизированно.
- id: data_structures-09
  d: 3
  text: Какой обход бинарного дерева поиска выдаёт ключи в возрастающем порядке?
  options: [Симметричный (in-order), Прямой (pre-order), Обратный (post-order), В ширину]
  correct: A
  explanation: 'In-order: левое поддерево, узел, правое поддерево.'
- id: data_structures-10
  d: 4
  text: Чем самобалансирующееся дерево (AVL, красно-чёрное) лучше обычного BST?
  options: [Не требует сравнения ключей, Операции выполняются за O(1), Занимает меньше памяти, Гарантирует высоту O(log n) и операции за O(log n) в худшем случае]
  correct: D
  explanation: Балансировка поворотами предотвращает вырождение в список.
- id: data_structures-11
  d: 4
  text: Для чего используется префиксное дерево (trie)?
  options: [Для сортировки чисел, Для поиска кратчайшего пути, Для быстрого поиска строк и поиска по префиксу, Для хранения матриц]
  correct: C
  explanation: Поиск и вставка строки длины L выполняются за O(L) независимо от числа строк.
- id: data_structures-12
  d: 4
  text: Какую структуру выбрать для запросов «сумма на отрезке» и «изменить один элемент» на массиве из 10^5 элементов?
  options: [Односвязный список, Дерево отрезков или дерево Фенвика, Стек, Обычный массив]
  correct: B
  explanation: Обе операции выполняются за O(log n), тогда как у простого массива одна из операций O(n).
- id: data_structures-13
  d: 4
  text: Что такое фильтр Блума?
  options: ['Вероятностная структура: возможны ложные срабатывания, но не ложноотрицательные', Точная структура для поиска подстрок, Дерево для хранения интервалов, 'Вероятностная структура: возможны ложноотрицательные, но не ложные срабатывания']
  correct: A
  explanation: Фильтр Блума может ошибочно сказать «есть», но если сказал «нет» — элемента точно нет.
- id: data_structures-14
  d: 5
  text: Какой способ хранения графа с V вершинами и E рёбрами эффективнее по памяти для разреженного графа?
  options: [Одинаково, Матрица инцидентности всегда лучше, 'Матрица смежности, O(V^2)', 'Списки смежности, O(V + E)']
  correct: D
  explanation: При E << V^2 списки смежности экономят память.
- id: data_structures-15
  d: 5
  text: Почему в B-деревьях используют узлы с большим числом потомков при хранении индексов на диске?
  options: [Чтобы обходить дерево без рекурсии, Чтобы хранить дубликаты, Чтобы уменьшить высоту дерева и число обращений к диску, Чтобы упростить код]
  correct: C
  explanation: 'Узел подгоняют под размер страницы: ветвление в сотни даёт высоту 3-4 на миллионы ключей.'
