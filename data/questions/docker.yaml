# Черновик банка: вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: docker
status: draft
source: llm_draft
questions:
- id: docker-01
  d: 1
  text: Чем образ (image) Docker отличается от контейнера?
  options: [Это одно и то же, Образ работает только на Linux, 'Контейнер — шаблон, образ — процесс', 'Образ — шаблон только для чтения, контейнер — запущенный экземпляр образа']
  correct: D
  explanation: Из одного образа можно запустить много контейнеров.
- id: docker-02
  d: 1
  text: Какая команда запускает контейнер из образа nginx?
  options: [docker build nginx, docker start nginx-image, docker run nginx, docker exec nginx]
  correct: C
  explanation: docker run создаёт и запускает контейнер из образа.
- id: docker-03
  d: 2
  text: Для чего служит Dockerfile?
  options: [Для хранения данных контейнера, Для пошагового описания сборки образа, Для описания набора контейнеров, Для настройки сети хоста]
  correct: B
  explanation: docker build читает инструкции FROM, COPY, RUN и другие.
- id: docker-04
  d: 2
  text: Что делает флаг -p 8080:80 в docker run?
  options: [Пробрасывает порт 80 контейнера на порт 8080 хоста, Ограничивает память, Пробрасывает порт 8080 контейнера на порт 80 хоста, Задаёт пароль]
  correct: A
  explanation: Формат -p хост:контейнер.
- id: docker-05
  d: 2
  text: Что произойдёт с данными, записанными внутрь файловой системы контейнера, после удаления контейнера?
  options: [Попадут в Docker Hub, Сохранятся на хосте автоматически, Сохранятся в образе, 'Будут потеряны, если не использовать том (volume) или bind mount']
  correct: D
  explanation: Слой записи контейнера удаляется вместе с ним.
- id: docker-06
  d: 3
  text: В чём разница между CMD и ENTRYPOINT?
  options: [CMD нельзя переопределить, ENTRYPOINT выполняется только при сборке, 'ENTRYPOINT задаёт основную команду, CMD — аргументы по умолчанию, которые можно переопределить', Разницы нет]
  correct: C
  explanation: Вместе ENTRYPOINT ['app'] и CMD ['--help'] запускают app --help по умолчанию.
- id: docker-07
  d: 3
  text: Почему в Dockerfile сначала копируют файл зависимостей и ставят зависимости, а потом копируют остальной код?
  options: [Так требует синтаксис, 'Чтобы использовать кеш слоёв: зависимости не переустанавливаются при изменении кода', Чтобы код был защищён, Чтобы образ был меньше в 2 раза]
  correct: B
  explanation: Слой пересобирается только если изменились его входные данные или предыдущие слои.
- id: docker-08
  d: 3
  text: Для чего нужен docker compose?
  options: [Для описания и запуска многоконтейнерного приложения из YAML-файла, Для публикации образов, Для мониторинга хоста, Для сборки одного образа]
  correct: A
  explanation: compose.yaml описывает сервисы, сети, тома и зависимости.
- id: docker-09
  d: 3
  text: Как два контейнера в одной пользовательской сети compose обращаются друг к другу?
  options: [Это невозможно, Только по IP-адресу хоста, Через localhost, По имени сервиса через встроенный DNS]
  correct: D
  explanation: Docker разрешает имена сервисов в адреса контейнеров внутри сети.
- id: docker-10
  d: 4
  text: Зачем применяют многоступенчатую сборку (multi-stage build)?
  options: [Для ускорения pull, Для параллельного запуска контейнеров, Чтобы в итоговый образ не попали компиляторы и исходники этапа сборки, Для шифрования образа]
  correct: C
  explanation: Артефакты копируются из этапа сборки (COPY --from) в минимальный итоговый образ.
- id: docker-11
  d: 4
  text: Чем отличается том (volume) от bind mount?
  options: [Том работает только на Windows, Том управляется Docker и хранится в его каталоге; bind mount монтирует конкретный путь хоста, Bind mount управляется Docker, Ничем]
  correct: B
  explanation: Тома удобнее для переносимости; bind mount — для разработки с живым кодом.
- id: docker-12
  d: 4
  text: Чем контейнер принципиально отличается от виртуальной машины?
  options: [Контейнеры разделяют ядро хоста и изолируются namespaces и cgroups, Контейнер запускает собственное ядро ОС, Контейнеры всегда медленнее, Разницы нет]
  correct: A
  explanation: Изоляция процессов, сети и файловой системы достигается средствами ядра Linux, без гипервизора.
- id: docker-13
  d: 4
  text: Почему запуск процесса в контейнере от root считается рискованным?
  options: [Docker не поддерживает root, Образ не соберётся, Он медленнее, При выходе из изоляции или ошибке конфигурации злоумышленник получает привилегии root на хосте]
  correct: D
  explanation: Лучше использовать инструкцию USER с непривилегированным пользователем.
- id: docker-14
  d: 5
  text: Контейнер с PID 1 игнорирует SIGTERM и docker stop ждёт 10 секунд до SIGKILL. Что вероятнее всего причина?
  options: [Образ слишком большой, Docker сломан, 'Процесс запущен в shell-форме CMD, и сигнал получает shell, а не приложение', Не хватает памяти]
  correct: C
  explanation: Exec-форма CMD ['app'] передаёт сигналы приложению напрямую; PID 1 также не получает дефолтных обработчиков сигналов ядра.
- id: docker-15
  d: 5
  text: Как уменьшить риск утечки секрета при сборке образа?
  options: [Положить в COPY и удалить следующим RUN, Передавать через BuildKit secret mounts и не писать в слои, Закодировать в base64 в ARG, Записать в ENV в Dockerfile]
  correct: B
  explanation: Содержимое слоёв сохраняется в истории; ENV, ARG и удалённые файлы остаются доступными.
