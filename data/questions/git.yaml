# Черновик банка (E2-5): вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: git
status: draft
source: llm_draft
questions:
- id: git-01
  d: 1
  text: Какая команда показывает состояние рабочей директории и индекса?
  options: [git status, git diff --all, git log, git show]
  correct: A
  explanation: git status выводит изменённые, добавленные и неотслеживаемые файлы.
- id: git-02
  d: 1
  text: Какая команда создаёт коммит из проиндексированных изменений?
  options: [git save 'msg', git add -m 'msg', git push -m 'msg', git commit -m 'msg']
  correct: D
  explanation: git commit фиксирует содержимое индекса.
- id: git-03
  d: 2
  text: Чем git fetch отличается от git pull?
  options: [fetch работает только с тегами, 'pull только скачивает, fetch сливает', 'fetch только скачивает изменения, pull ещё и сливает их в текущую ветку', Ничем]
  correct: C
  explanation: pull = fetch + merge (или rebase).
- id: git-04
  d: 2
  text: Как создать новую ветку feature и сразу переключиться на неё?
  options: [git branch feature, git checkout -b feature (или git switch -c feature), git merge feature, git new feature]
  correct: B
  explanation: Ключ -b у checkout и -c у switch создают ветку и переключают на неё.
- id: git-05
  d: 2
  text: Для чего нужен файл .gitignore?
  options: ['Перечисляет шаблоны файлов, которые Git не отслеживает', Хранит секреты, Шифрует историю, Удаляет файлы из репозитория]
  correct: A
  explanation: Уже отслеживаемые файлы .gitignore не затрагивает.
- id: git-06
  d: 3
  text: Как отменить последний коммит, сохранив изменения в рабочей директории и индексе?
  options: [git clean -fd, git reset --hard HEAD~1, git revert --hard, git reset --soft HEAD~1]
  correct: D
  explanation: --soft двигает ветку назад, не трогая индекс и файлы; --hard сбрасывает всё.
- id: git-07
  d: 3
  text: Что делает git revert <commit>?
  options: [Удаляет коммит из истории, Переписывает историю ветки, 'Создаёт новый коммит, отменяющий изменения указанного', Откатывает рабочую директорию без коммита всегда]
  correct: C
  explanation: revert не переписывает историю и безопасен для общих веток.
- id: git-08
  d: 3
  text: Чем rebase отличается от merge при интеграции ветки?
  options: [merge удаляет исходную ветку, 'rebase переносит коммиты поверх целевой ветки, давая линейную историю, и меняет их хеши', 'rebase создаёт merge-коммит, merge — нет', Они полностью эквивалентны]
  correct: B
  explanation: rebase переписывает коммиты; поэтому не стоит делать rebase опубликованных общих веток.
- id: git-09
  d: 3
  text: Что делает git stash?
  options: ['Временно прячет незакоммиченные изменения, чистя рабочую директорию', Создаёт тег, Отправляет изменения на сервер, Удаляет неотслеживаемые файлы]
  correct: A
  explanation: Спрятанное можно вернуть командой git stash pop.
- id: git-10
  d: 4
  text: Как найти коммит, внёсший баг, с помощью бинарного поиска по истории?
  options: [git grep, git blame, git cherry-pick, git bisect]
  correct: D
  explanation: git bisect делит интервал истории пополам, пока не найдёт первый плохой коммит.
- id: git-11
  d: 4
  text: Что делает git cherry-pick <commit>?
  options: [Показывает автора строки, Сливает всю ветку, Копирует изменения указанного коммита в текущую ветку как новый коммит, Удаляет коммит]
  correct: C
  explanation: Полезно для переноса отдельного исправления между ветками.
- id: git-12
  d: 4
  text: Вы случайно сделали git reset --hard и потеряли коммиты. Как их найти?
  options: [Они удалены навсегда сразу, git reflog покажет прежние положения HEAD, git log --all всегда покажет их, Только через сервер]
  correct: B
  explanation: reflog хранит историю перемещений ссылок, пока сборщик мусора не удалил недостижимые объекты.
- id: git-13
  d: 4
  text: Что означает конфликт слияния?
  options: ['Обе ветки изменили одни и те же строки, Git не может выбрать автоматически', Репозиторий повреждён, Слишком много коммитов, Нет доступа к серверу]
  correct: A
  explanation: Конфликт отмечается маркерами <<<<<<<, =======, >>>>>>>; после правки файл нужно добавить и завершить слияние.
- id: git-14
  d: 5
  text: Почему не рекомендуется делать git push --force в общую ветку?
  options: [Git запрещает это всегда, Это замедляет репозиторий, Команда не работает, Можно перезаписать чужие коммиты на сервере; безопаснее --force-with-lease]
  correct: D
  explanation: --force-with-lease откажет, если удалённая ветка изменилась с момента последнего fetch.
- id: git-15
  d: 5
  text: Из чего Git строит идентификатор (хеш) коммита?
  options: [Только из сообщения коммита, Случайно, 'Из содержимого объекта коммита: дерево, родители, автор, время, сообщение', Из имени ветки и времени]
  correct: C
  explanation: Изменение любого поля (в том числе родителя при rebase) даёт другой хеш.
