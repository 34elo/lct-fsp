# Черновик банка (E2-5): вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: algorithms
status: draft
source: llm_draft
questions:
- id: algorithms-01
  d: 1
  text: Какая временная сложность бинарного поиска в отсортированном массиве из n элементов?
  options: [O(n), O(1), O(n log n), O(log n)]
  correct: D
  explanation: На каждом шаге диапазон поиска сокращается вдвое.
- id: algorithms-02
  d: 1
  text: Что нужно обязательно знать о массиве, чтобы применить к нему бинарный поиск?
  options: [В нём нет повторов, Его длина — степень двойки, Он отсортирован, Он состоит из чисел]
  correct: C
  explanation: Бинарный поиск опирается на упорядоченность.
- id: algorithms-03
  d: 2
  text: Какая сложность у сортировки пузырьком в худшем случае?
  options: [O(log n), O(n^2), O(n log n), O(n)]
  correct: B
  explanation: Два вложенных прохода по массиву дают квадратичную сложность.
- id: algorithms-04
  d: 2
  text: Какой алгоритм обхода графа использует очередь и находит кратчайшие пути в невзвешенном графе?
  options: [BFS, DFS, Флойд-Уоршелл, Дейкстра с кучей]
  correct: A
  explanation: BFS обходит вершины по слоям расстояния от источника.
- id: algorithms-05
  d: 2
  text: 'Чему равна сложность вложенного цикла for i in 0..n: for j in 0..i: ?'
  options: [O(n), O(2^n), O(n log n), O(n^2)]
  correct: D
  explanation: Сумма 0+1+...+(n-1) = n(n-1)/2 = O(n^2).
- id: algorithms-06
  d: 3
  text: Какова средняя сложность быстрой сортировки (quicksort) и худшая?
  options: [O(n) и O(n^2), O(n^2) и O(n^2), O(n log n) и O(n^2), O(n log n) и O(n log n)]
  correct: C
  explanation: При плохом выборе опорного элемента (например, отсортированный массив) разбиение вырождается.
- id: algorithms-07
  d: 3
  text: Какой алгоритм находит кратчайшие пути от одной вершины во взвешенном графе без отрицательных рёбер?
  options: [Алгоритм Краскала, Алгоритм Дейкстры, BFS, Топологическая сортировка]
  correct: B
  explanation: Дейкстра работает при неотрицательных весах; с кучей — O((V+E) log V).
- id: algorithms-08
  d: 3
  text: Какая идея лежит в основе динамического программирования?
  options: [Разбиение на перекрывающиеся подзадачи и запоминание их решений, Случайный перебор, Сортировка входных данных, Всегда жадный выбор лучшего варианта]
  correct: A
  explanation: ДП применимо при оптимальной подструктуре и перекрывающихся подзадачах.
- id: algorithms-09
  d: 3
  text: Какая сложность у вычисления n-го числа Фибоначчи наивной рекурсией fib(n) = fib(n-1) + fib(n-2)?
  options: [O(log n), O(n), O(n^2), O(2^n) (экспоненциальная)]
  correct: D
  explanation: Дерево вызовов растёт экспоненциально; мемоизация сводит сложность к O(n).
- id: algorithms-10
  d: 4
  text: Какой алгоритм подходит для поиска остовного дерева минимального веса?
  options: [Беллман-Форд, Тарьян для мостов, Краскал или Прим, Дейкстра]
  correct: C
  explanation: Краскал (с СНМ) и Прим строят минимальное остовное дерево.
- id: algorithms-11
  d: 4
  text: 'Задача о рюкзаке 0/1 с n предметами и вместимостью W решается ДП за:'
  options: [O(n + W), O(n * W), O(2^n) всегда, O(W log n)]
  correct: B
  explanation: Таблица состояний n x W; это псевдополиномиальная сложность.
- id: algorithms-12
  d: 4
  text: Какой подход обычно решает задачу о выборе максимального числа непересекающихся отрезков?
  options: ['Жадный: сортировка по правому концу и выбор первого подходящего', Полный перебор подмножеств, 'Жадный: сортировка по левому концу', Поиск в ширину]
  correct: A
  explanation: Выбор отрезка, заканчивающегося раньше всех, оставляет больше всего места для остальных.
- id: algorithms-13
  d: 4
  text: Для чего служит алгоритм Беллмана-Форда в отличие от Дейкстры?
  options: [Работает только на деревьях, Работает быстрее на плотных графах, Находит остовное дерево, Работает с отрицательными рёбрами и обнаруживает отрицательные циклы]
  correct: D
  explanation: Релаксация всех рёбер V-1 раз; дополнительный проход выявляет отрицательный цикл.
- id: algorithms-14
  d: 5
  text: Какая нижняя оценка числа сравнений для сортировки n элементов в модели сравнений?
  options: [Ω(n), Ω(log n), Ω(n log n), Ω(n^2)]
  correct: C
  explanation: Дерево решений имеет n! листьев, высота не меньше log2(n!) = Θ(n log n).
- id: algorithms-15
  d: 5
  text: Чему равна амортизированная стоимость операции добавления в динамический массив с удвоением ёмкости?
  options: [O(log n), O(1), O(n log n), O(n)]
  correct: B
  explanation: 'Дорогое копирование происходит редко: суммарно не более 2n элементарных операций на n добавлений.'
