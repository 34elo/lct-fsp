# Черновик банка (E2-5): вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: linux
status: draft
source: llm_draft
questions:
- id: linux-01
  d: 1
  text: Какая команда показывает текущий рабочий каталог?
  options: [whoami, cd, pwd, ls]
  correct: C
  explanation: pwd — print working directory.
- id: linux-02
  d: 1
  text: Какая команда выводит содержимое каталога подробным списком с правами доступа?
  options: [cat -l, ls -l, dir --all, pwd -l]
  correct: B
  explanation: ls -l показывает права, владельца, размер и дату.
- id: linux-03
  d: 2
  text: Что означает права доступа rwxr-xr-- у файла?
  options: ['Владелец: чтение, запись, исполнение; группа: чтение, исполнение; остальные: чтение', 'Владелец: только чтение', 'Владелец: чтение; группа: запись; остальные: исполнение', Все могут всё]
  correct: A
  explanation: 'Три тройки: владелец rwx, группа r-x, остальные r--; в числовом виде 754.'
- id: linux-04
  d: 2
  text: Что делает команда grep -r 'error' /var/log?
  options: [Удаляет строки с error, Считает размер каталога, Переименовывает файлы, Рекурсивно ищет строку error в файлах каталога]
  correct: D
  explanation: grep ищет по шаблону, ключ -r включает рекурсию.
- id: linux-05
  d: 2
  text: Что делает оператор | (конвейер) в командной строке?
  options: [Объединяет две команды через И, Записывает вывод в файл, Передаёт стандартный вывод одной команды на стандартный ввод другой, Запускает команду в фоне]
  correct: C
  explanation: Например, ps aux | grep nginx.
- id: linux-06
  d: 3
  text: Чем отличается > от >> при перенаправлении вывода?
  options: ['>> перезаписывает, > дописывает', '> перезаписывает файл, >> дописывает в конец', Ничем, '> работает только для ошибок']
  correct: B
  explanation: Оба создают файл, если его нет.
- id: linux-07
  d: 3
  text: Как узнать, какой процесс слушает порт 8080?
  options: ['ss -ltnp | grep 8080 (или lsof -i :8080)', df -h 8080, ping 8080, ls /8080]
  correct: A
  explanation: ss показывает сокеты, -p — процессы (для чужих нужны права root).
- id: linux-08
  d: 3
  text: Что делает chmod +x script.sh?
  options: [Шифрует файл, Меняет владельца, Удаляет файл, Делает файл исполняемым]
  correct: D
  explanation: Устанавливает бит исполнения для файла.
- id: linux-09
  d: 3
  text: Какая команда показывает использование дискового пространства файловыми системами?
  options: [du -sh ., top, df -h, free -h]
  correct: C
  explanation: df — по файловым системам, du — по каталогам; free показывает память.
- id: linux-10
  d: 4
  text: Что делает kill -9 <pid>?
  options: [Приостанавливает процесс, 'Посылает SIGKILL: процесс немедленно завершается без обработки сигнала', Вежливо просит процесс завершиться, Перезапускает процесс]
  correct: B
  explanation: SIGKILL нельзя перехватить; предпочтительнее сначала SIGTERM (kill без флага).
- id: linux-11
  d: 4
  text: Что такое жёсткая ссылка (hard link) в отличие от символической?
  options: ['Ещё одно имя того же inode, работает до удаления последнего имени', Ссылка через сеть, Файл с путём к другому файлу, Ссылка только на каталоги]
  correct: A
  explanation: Символическая ссылка хранит путь и может «висеть»; жёсткая указывает на тот же inode.
- id: linux-12
  d: 4
  text: Какой командой посмотреть логи юнита nginx в systemd за последний час?
  options: [cat /var/log/systemd, systemctl log nginx, dmesg nginx, journalctl -u nginx --since '1 hour ago']
  correct: D
  explanation: journalctl читает журнал systemd, -u фильтрует по юниту.
- id: linux-13
  d: 4
  text: Что означает load average 8.0 на машине с 4 ядрами?
  options: [Работает 8 процессов, Свободно 8 ГБ, В среднем в очереди на выполнение или в ожидании ввода-вывода около 8 задач — вдвое больше числа ядер, Загрузка 8%]
  correct: C
  explanation: 'Load average сравнивают с числом ядер: значение заметно выше числа ядер говорит о перегрузке.'
- id: linux-14
  d: 5
  text: Диск показывает 100% по df -h, но du не находит столько данных. Что может объяснить это?
  options: [Неправильно считает du, 'Файл удалён, но удерживается открытым процессом', Кеш браузера, Это невозможно]
  correct: B
  explanation: Место освобождается после закрытия файла процессом; проверить через lsof +L1.
- id: linux-15
  d: 5
  text: Для чего служат cgroups?
  options: ['Для ограничения и учёта ресурсов (CPU, память, ввод-вывод) групп процессов', Для сетевого экрана, Для разграничения доступа к файлам по группам пользователей, Для шифрования диска]
  correct: A
  explanation: Вместе с namespaces cgroups — основа контейнеров.
