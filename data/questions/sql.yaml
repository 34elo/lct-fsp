# Черновик банка (E2-5): вопросы не проверены вторым человеком. После проверки status: draft -> approved.
skill: sql
status: draft
source: llm_draft
questions:
- id: sql-01
  d: 1
  text: Какая команда выбирает строки из таблицы?
  options: [SELECT, GET, READ, FETCH TABLE]
  correct: A
  explanation: Выборка данных выполняется оператором SELECT.
- id: sql-02
  d: 1
  text: Какое условие в WHERE отбирает строки, где столбец age равен NULL?
  options: [age == NULL, age = NULL, age EQUALS NULL, age IS NULL]
  correct: D
  explanation: Сравнение с NULL через = даёт UNKNOWN; нужно IS NULL.
- id: sql-03
  d: 2
  text: В чём разница между WHERE и HAVING?
  options: [WHERE работает только с JOIN, HAVING работает только с текстом, 'WHERE фильтрует строки до группировки, HAVING — группы после агрегации', Разницы нет]
  correct: C
  explanation: HAVING применяется к результатам GROUP BY и может использовать агрегатные функции.
- id: sql-04
  d: 2
  text: Что делает LEFT JOIN?
  options: [Объединяет таблицы без условия, 'Возвращает все строки левой таблицы, для несовпавших правых значения NULL', Возвращает только совпавшие строки обеих таблиц, Возвращает все строки правой таблицы]
  correct: B
  explanation: LEFT JOIN сохраняет все строки левой таблицы.
- id: sql-05
  d: 2
  text: Что вернёт COUNT(*) и COUNT(col), если в col есть NULL?
  options: ['COUNT(*) считает все строки, COUNT(col) — только не-NULL', Оба считают только не-NULL, COUNT(col) больше, Одинаковое значение]
  correct: A
  explanation: COUNT(col) пропускает NULL-значения.
- id: sql-06
  d: 3
  text: Что делает UNION по сравнению с UNION ALL?
  options: [UNION быстрее, Это синонимы, UNION ALL удаляет дубликаты, 'UNION удаляет дубликаты, UNION ALL — нет']
  correct: D
  explanation: UNION выполняет дедупликацию, что дороже по времени.
- id: sql-07
  d: 3
  text: Какой запрос вернёт вторую по величине зарплату в таблице emp(salary) при возможных повторах?
  options: [SELECT MIN(salary) FROM emp, SELECT salary FROM emp LIMIT 2, SELECT MAX(salary) FROM emp WHERE salary < (SELECT MAX(salary) FROM emp), SELECT MAX(salary) FROM emp]
  correct: C
  explanation: Максимум среди значений, меньших общего максимума, даёт вторую различную зарплату.
- id: sql-08
  d: 3
  text: Чему равно выражение NULL = NULL в WHERE?
  options: ['TRUE', 'UNKNOWN, строка не пройдёт фильтр', Ошибка синтаксиса, 'FALSE']
  correct: B
  explanation: 'Трёхзначная логика SQL: любое сравнение с NULL даёт UNKNOWN.'
- id: sql-09
  d: 3
  text: Что такое индекс и какой у него главный компромисс?
  options: ['Ускоряет чтение, замедляет запись и занимает место', 'Ускоряет и чтение, и запись без недостатков', Хранит копию таблицы для резервного копирования, Запрещает дубликаты во всех столбцах]
  correct: A
  explanation: Индекс требует обновления при INSERT/UPDATE/DELETE и места на диске.
- id: sql-10
  d: 4
  text: Что делает оконная функция ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC)?
  options: [Считает число отделов, Сортирует итоговую таблицу целиком, Схлопывает строки по dept, 'Нумерует строки внутри каждого dept по убыванию зарплаты, не схлопывая их']
  correct: D
  explanation: Оконная функция не группирует строки, а добавляет вычисляемое значение к каждой.
- id: sql-11
  d: 4
  text: Какой уровень изоляции по стандарту допускает неповторяемое чтение, но не грязное?
  options: [REPEATABLE READ, SERIALIZABLE, READ COMMITTED, READ UNCOMMITTED]
  correct: C
  explanation: READ COMMITTED исключает грязное чтение, но допускает неповторяемое и фантомное.
- id: sql-12
  d: 4
  text: Чем плох запрос SELECT * FROM t WHERE LOWER(name) = 'иван', если индекс создан по name?
  options: [LOWER не поддерживается в WHERE, Функция над столбцом мешает использовать обычный индекс по name, Ничем, Запрос вернёт NULL]
  correct: B
  explanation: Нужен функциональный индекс по LOWER(name) либо сравнение без функции.
- id: sql-13
  d: 4
  text: Что делает запрос?
  code: 'SELECT dept, COUNT(*) FROM emp

    GROUP BY dept

    HAVING COUNT(*) > 5;'
  options: [Отделы с более чем 5 сотрудниками и их число, 'Ошибку: HAVING нельзя без WHERE', Первые 5 отделов, 'Все отделы, число сотрудников больше 5 у каждой строки']
  correct: A
  explanation: HAVING фильтрует группы после агрегации.
- id: sql-14
  d: 5
  text: Какой запрос корректно вернёт клиентов без единого заказа (таблицы c(id), o(client_id))?
  options: [SELECT c.id FROM c JOIN o ON o.client_id = c.id, SELECT id FROM c WHERE id = NULL, SELECT id FROM c WHERE id NOT IN (SELECT client_id FROM o)  при возможном NULL в o.client_id, SELECT c.id FROM c LEFT JOIN o ON o.client_id = c.id WHERE o.client_id IS NULL]
  correct: D
  explanation: NOT IN с NULL в подзапросе даёт пустой результат из-за трёхзначной логики; анти-JOIN или NOT EXISTS безопаснее.
- id: sql-15
  d: 5
  text: Что такое фантомное чтение?
  options: ['Чтение данных, ещё не зафиксированных другой транзакцией', Чтение удалённой таблицы, Повторный запрос в транзакции возвращает другой набор строк из-за вставок другой транзакции, Повторное чтение одной строки даёт другое значение]
  correct: C
  explanation: Фантомы — новые или исчезнувшие строки в диапазоне при повторном запросе.
