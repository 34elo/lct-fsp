<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аватар-созвездие</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="display: inline-flex; width: {{px}}px; height: {{px}}px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 64 64" fill="none" role="img" aria-label="Аватар-созвездие кандидата" style="display: block">
<rect x="0.5" y="0.5" width="63" height="63" rx="10" fill="{{bg}}" stroke="{{edge}}"></rect>
<sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
<g stroke="{{line}}" stroke-width="1.5" stroke-linecap="round">
<path d="M32 12L30 30M17 24L30 30M30 30L46 25M30 30L22 46M22 46L40 48M46 25L50 40M40 48L50 40"></path>
</g>
<circle cx="32" cy="12" r="4" fill="{{red}}"></circle>
<circle cx="17" cy="24" r="3.4" fill="{{grey}}"></circle>
<circle cx="30" cy="30" r="4.4" fill="{{blue}}"></circle>
<circle cx="46" cy="25" r="3.4" fill="{{blue}}"></circle>
<circle cx="22" cy="46" r="3.6" fill="{{blue}}"></circle>
<circle cx="40" cy="48" r="3.4" fill="{{blue}}"></circle>
<circle cx="50" cy="40" r="3.2" fill="{{grey}}"></circle>
</sc-if>
<sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
<g stroke="{{line}}" stroke-width="1.5" stroke-linecap="round">
<path d="M14 18L28 22M28 22L44 14M28 22L38 36M38 36L20 44M38 36L48 50"></path>
</g>
<circle cx="14" cy="18" r="3.4" fill="{{grey}}"></circle>
<circle cx="28" cy="22" r="4.4" fill="{{blue}}"></circle>
<circle cx="44" cy="14" r="4" fill="{{red}}"></circle>
<circle cx="38" cy="36" r="4" fill="{{blue}}"></circle>
<circle cx="20" cy="44" r="3.4" fill="{{blue}}"></circle>
<circle cx="48" cy="50" r="3.2" fill="{{grey}}"></circle>
</sc-if>
<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
<g stroke="{{line}}" stroke-width="1.5" stroke-linecap="round">
<path d="M32 10L32 34M12 32L32 34M32 34L52 30M32 34L32 54"></path>
</g>
<circle cx="32" cy="10" r="4" fill="{{red}}"></circle>
<circle cx="12" cy="32" r="3.4" fill="{{grey}}"></circle>
<circle cx="32" cy="34" r="4.6" fill="{{blue}}"></circle>
<circle cx="52" cy="30" r="3.4" fill="{{grey}}"></circle>
<circle cx="32" cy="54" r="3.6" fill="{{blue}}"></circle>
</sc-if>
<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
<g stroke="{{line}}" stroke-width="1.5" stroke-linecap="round">
<path d="M10 14L24 26M24 26L40 16M40 16L54 30M54 30L38 40M24 26L38 40M38 40L22 48M22 48L12 38M38 40L48 54"></path>
</g>
<circle cx="10" cy="14" r="3.2" fill="{{grey}}"></circle>
<circle cx="24" cy="26" r="4" fill="{{red}}"></circle>
<circle cx="40" cy="16" r="3.4" fill="{{blue}}"></circle>
<circle cx="54" cy="30" r="3.2" fill="{{grey}}"></circle>
<circle cx="38" cy="40" r="4.4" fill="{{blue}}"></circle>
<circle cx="22" cy="48" r="3.4" fill="{{blue}}"></circle>
<circle cx="12" cy="38" r="3.2" fill="{{blue}}"></circle>
<circle cx="48" cy="54" r="3.4" fill="{{blue}}"></circle>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"int","default":0,"min":0,"max":3},"size":{"editor":"int","default":64,"min":24,"max":240},"tone":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
renderVals() {
const seed = Number(this.props.seed ?? 0) % 4;
const px = Number(this.props.size ?? 64) || 64;
const dark = (this.props.tone ?? 'light') === 'dark';
return {
px: px,
s0: seed === 0, s1: seed === 1, s2: seed === 2, s3: seed === 3,
bg: dark ? '#201880' : '#F4F3FF',
edge: dark ? '#2C20AD' : '#E6E4FF',
line: dark ? '#796DFF' : '#402FFF',
blue: dark ? '#A9A1FF' : '#402FFF',
grey: dark ? '#EDEDED' : '#C8C9CA',
red: '#EC1D35'
};
}
}
</script>
</body>
</html>
