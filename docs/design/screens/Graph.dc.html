<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"int","default":0,"min":0,"max":3,"section":"Граф"},"$preview":{"width":760,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const sel = (st.sel === undefined || st.sel === null) ? Number(this.props.selected ?? 0) : st.sel;
const ids = ['py','fa','pg','alg','dk','as','rb','kf','f1','f2','f3','f4','e1a','e1p','e2p','e2f','e2d','e3g','e4f','efa','erk'];
const sets = [
['fa','f2','f4','as','e2f','e4f','efa'],
['pg','f3','e3g'],
['kf','rb','erk'],
ids
];
const act = sets[sel] || ids;
const o = {};
ids.forEach((id) => { o[id] = act.indexOf(id) >= 0 ? 1 : 0.14; });
o.ce = sel === 3 ? 0.6 : 0.25;
const labels = ['FastAPI', 'PostgreSQL', 'Kafka', 'Все связи'];
const texts = [
'Требование «FastAPI» → навык FastAPI ●●●○ → факты: GitHub · 14 репозиториев (сильная связь), ИИ-интервью по коду. Из него выведен asyncio.',
'Требование «PostgreSQL» → навык PostgreSQL ●●○○ → факт: адаптивный тест SQL · 78%. Чтобы дойти до ●●●○, нужен код с миграциями или соревнование.',
'Требование «Kafka» → фактов нет. Есть смежный навык RabbitMQ ●●○○ (брокеры сообщений): подтверждение Kafka даст ⚠ → ✓.',
'Показаны все связи: чем толще линия, тем сильнее факт подтверждает навык.'
];
return {
o: o,
reqs: labels.map((label, i) => ({
label: label,
pressed: sel === i,
bd: sel === i ? '#402FFF' : '#CDC9FF',
bg: sel === i ? '#402FFF' : '#fff',
fg: sel === i ? '#ffffff' : '#201880',
pick: () => this.setState({ sel: i })
})),
pathText: texts[sel] || texts[3]
};
}
}
</script>
