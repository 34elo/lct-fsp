[project]
name = "lct-fsp"
version = "0.1.0"
description = "ФСП Карьера: монорепо"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "packages/platform", "services/*"]  # явный список: packages/ui — не Python-пакет

[tool.uv.sources]
fsp-contracts = { workspace = true }
fsp-platform = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tools/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "fakeredis[lua]>=2.26",
  "moto[s3]>=5.0",
  "pytest-xdist>=3.8.0",
]
# Нагрузочный стенд: ставится только для `make load`, в сервисы не попадает.
load = ["locust>=2.29"]
