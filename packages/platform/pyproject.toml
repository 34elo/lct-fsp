[project]
name = "fsp-platform"
version = "0.1.0"
description = "Общая платформа: конфиг, БД, outbox/inbox, FastStream, JWT, логи"
requires-python = ">=3.12"
dependencies = [
  "fsp-contracts",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "structlog>=24.4",
  "pyjwt>=2.9",
  "faststream[rabbit]>=0.5",
  "fastapi>=0.115",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsp_platform"]
