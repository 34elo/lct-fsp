[project]
name = "fsp-contracts"
version = "0.1.0"
description = "Общие pydantic-схемы: события, команды, DTO"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsp_contracts"]
